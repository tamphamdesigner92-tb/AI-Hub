# AI Hub — nguồn sự thật duy nhất về model
# Sửa file này bằng tay hoặc để `aihub pull` tự thêm entry.
# TUYỆT ĐỐI KHÔNG để API key / token ở đây.

schema = 1

[hub]
# Đường dẫn Windows dùng chuỗi TOML nháy đơn (literal) để dấu \ không bị hiểu là escape.
# %USERPROFILE% được mở lúc chạy, nhờ vậy file này chép sang máy khác vẫn đúng.
root        = 'E:\AI Hub'
home        = '%USERPROFILE%\.aihub'   # bí danh không dấu cách, cho client Node & script
store       = 'E:\AI Hub\models'
default_llm = "qwen3-5"
default_asr = "whisper-large-v3-ct2"   # MLX là Apple-only; trên Windows dùng CTranslate2

# venv của các dự án cần client aihub. `aihub doctor` kiểm tra từng cái.
projects    = []

# ─────────────────────── Kho con & đường dẫn cũ được symlink về ───────────────────────
[stores.ollama]
path = "ollama"
legacy = '%USERPROFILE%\.ollama\models' 
env = "OLLAMA_MODELS"

[stores.hf]
path = "hf"
legacy = '%USERPROFILE%\.cache\huggingface' 
env = "HF_HOME"

[stores.whisper]
path = "whisper"
legacy = '%USERPROFILE%\.cache\whisper' 
env = "AIHUB_WHISPER_DIR"

[stores.torch]
path = "torch"
legacy = '%USERPROFILE%\.cache\torch' 
env = "TORCH_HOME"

[stores.ct2]
path = "ct2"
legacy = ""
env = "AIHUB_CT2_DIR"

[stores.custom]
path = "custom"
legacy = ""
env = "AIHUB_CUSTOM_DIR"

# ─────────────────────── Endpoint ───────────────────────
[endpoints.ollama]
base    = "http://127.0.0.1:11434"
openai  = "http://127.0.0.1:11434/v1"
api_key = "ollama"          # placeholder, Ollama bỏ qua. Không phải secret thật.
manage  = "aihub serve"

# Cổng 4123 nay là server lồng tiếng của CrabbyCut, KHÔNG phải chatterbox.
# Chatterbox đã bị bỏ: VoxCPM2-8bit lo được cả tiếng Anh lẫn tiếng Việt ở 48 kHz,
# trong khi chatterbox-tts ghim torch==2.6.0 còn whisperx đòi torch~=2.8.0 —
# không thể chung venv, mà thêm một venv nữa chỉ để làm việc VoxCPM2 đã làm.
[endpoints.crabbycut-tts]
base   = "http://127.0.0.1:4123"
openai = "http://127.0.0.1:4123/v1"
status = "installed"
owners = ["Test 1 - Whisper"]
serves = ["voxcpm2-8bit", "vieneu-tts"]
manage = "npm run tts:serve"
note   = "Giao thức OpenAI /v1/audio/speech. Giọng: voxcpm:<mô tả> hoặc vieneu:<preset>. Tự nhả model sau 5 phút rảnh."

